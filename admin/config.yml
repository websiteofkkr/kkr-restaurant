          - { label: "Image description (for accessibility)", name: "imageAlt", widget: "string", required: false }
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Message", name: "message", widget: "text", required: false }
          - { label: "Button text", name: "ctaLabel", widget: "string", required: false, default: "مینو وګورئ" }
          - { label: "Button link", name: "ctaLink", widget: "string", required: false, hint: "e.g. /ps/menu/ or a WhatsApp link" }
          - { label: "Start showing on", name: "startDate", widget: "datetime", required: false, hint: "Leave blank to start showing as soon as it's turned on." }
          - { label: "Stop showing on", name: "endDate", widget: "datetime", required: false, hint: "Leave blank to keep showing until you turn it off manually." }
          - { label: "Auto-close after (seconds)", name: "displaySeconds", widget: "number", default: 6, hint: "How long the popup stays before it closes itself. Visitors can also close it early with the × button." }

      - name: "home"
        label: "Homepage"
        file: "content/ps/home.json"
        description: "Every section of the homepage, in order. Turn a section off and it disappears from the site."
        fields:
          - { label: "Hero", name: "hero", widget: "object", fields: [
              { label: "Subheading", name: "sub", widget: "string", required: false },
              { label: "Location line", name: "place", widget: "string", required: false },
              { label: "Scroll cue text", name: "scrollLabel", widget: "string", required: false },
              { label: "Headline", name: "title", widget: "string" },
              { label: "Still frame", name: "image", widget: "image", hint: "Shown immediately, and instead of the video on slow connections." },
              { label: "Hero video", name: "video", widget: "file", required: false, hint: "Silent MP4. Plays automatically, on a loop, beside the headline." },
              { label: "Lighter video for phones", name: "videoSmall", widget: "file", required: false, hint: "The same clip, encoded smaller." }
            ] }
          - { label: "Peshawar film", name: "film", widget: "object", collapsed: true, fields: [
              { label: "Show this section", name: "enabled", widget: "boolean", default: true },
              { label: "Small line above the title", name: "kicker", widget: "string", required: false },
              { label: "Title", name: "title", widget: "string" },
              { label: "Text", name: "body", widget: "list", field: { label: "Paragraph", name: "p", widget: "text" } },
              { label: "Journey words", name: "beats", widget: "list", required: false, hint: "Peshawar, Heritage, Culture, Food, KKR Restaurant" },
              { label: "Video file", name: "video", widget: "file", required: false, hint: "MP4, H.264. Plays only when a visitor presses play." },
              { label: "Video file (WebM)", name: "videoWebm", widget: "file", required: false, hint: "Optional second format for browsers without H.264." },
              { label: "Poster image", name: "poster", widget: "image", hint: "Shown before the video plays, and instead of it on slow phones." },
              { label: "Poster description", name: "posterAlt", widget: "string", required: false },
              { label: "Caption", name: "caption", widget: "string", required: false }
            ] }
          - { label: "About KKR", name: "about", widget: "object", collapsed: true, fields: [
              { label: "Show this section", name: "enabled", widget: "boolean", default: true },
              { label: "Small line above the title", name: "kicker", widget: "string", required: false },
              { label: "Title", name: "title", widget: "string" },
              { label: "Text", name: "body", widget: "list", field: { label: "Paragraph", name: "p", widget: "text" } },
              { label: "Photograph", name: "image", widget: "image" },
              { label: "Photograph description", name: "imageAlt", widget: "string", required: false }
            ] }
          - { label: "Message from the CEO", name: "ceo", widget: "object", collapsed: true, fields: [
              { label: "Show this section", name: "enabled", widget: "boolean", default: true },
              { label: "Small line above the title", name: "kicker", widget: "string", required: false },
              { label: "Section title", name: "title", widget: "string" },
              { label: "CEO name", name: "name", widget: "string" },
              { label: "Position", name: "position", widget: "string" },
              { label: "Line under the rule", name: "company", widget: "string", required: false },
              { label: "Message", name: "message", widget: "list", field: { label: "Paragraph", name: "p", widget: "text" } },
              { label: "Photograph", name: "photo", widget: "image", required: false },
              { label: "Photograph description", name: "photoAlt", widget: "string", required: false },
              { label: "Closing line", name: "closing", widget: "string", required: false },
              { label: "Signature image", name: "signature", widget: "image", required: false }
            ] }
          - { label: "Signature dishes", name: "signature", widget: "object", collapsed: true, fields: [
              { label: "Show this section", name: "enabled", widget: "boolean", default: true },
              { label: "Small line above the title", name: "kicker", widget: "string", required: false },
              { label: "Title", name: "title", widget: "string" },
              { label: "Intro", name: "intro", widget: "text", required: false, hint: "Dishes shown here are the ones ticked as Signature dish in the Menu." },
              { label: "Extra platter photographs", name: "showcase", widget: "list", required: false, summary: "{{fields.name}}", fields: [
                  { label: "Photograph", name: "image", widget: "image" },
                  { label: "Name", name: "name", widget: "string" },
                  { label: "Photograph description", name: "alt", widget: "string", required: false },
                  { label: "Note under the name", name: "note", widget: "string", required: false }
                ] }
            ] }
          - { label: "Menu tabs", name: "menuTabs", widget: "object", collapsed: true, fields: [
              { label: "Show this section", name: "enabled", widget: "boolean", default: true },
              { label: "Small line above the title", name: "kicker", widget: "string", required: false },
              { label: "Title", name: "title", widget: "string" },
              { label: "Intro", name: "intro", widget: "text", required: false }
            ] }
          - { label: "Celebrations", name: "events", widget: "object", collapsed: true, fields: [
              { label: "Show this section", name: "enabled", widget: "boolean", default: true },
              { label: "Small line above the title", name: "kicker", widget: "string", required: false },
              { label: "Title", name: "title", widget: "string" },
              { label: "Text", name: "body", widget: "list", field: { label: "Paragraph", name: "p", widget: "text" } },
              { label: "Occasions", name: "items", widget: "list", required: false, fields: [
                  { label: "Name", name: "label", widget: "string" },
                  { label: "Icon", name: "icon", widget: "select", default: "arch", options: ["rings", "ring", "cake", "people", "peopleHeart", "briefcase", "calendar", "cloche", "dining", "toast", "arch"] }
                ] },
              { label: "Button text", name: "cta", widget: "string", required: false }
            ] }
          - { label: "Gallery section", name: "gallery", widget: "object", collapsed: true, fields: [
              { label: "Show this section", name: "enabled", widget: "boolean", default: true },
              { label: "Small line above the title", name: "kicker", widget: "string", required: false },
              { label: "Title", name: "title", widget: "string" },
              { label: "Intro", name: "intro", widget: "text", required: false },
              { label: "Follow button text", name: "followLabel", widget: "string", required: false }
            ] }
          - { label: "Reviews section", name: "reviews", widget: "object", collapsed: true, fields: [
              { label: "Show this section", name: "enabled", widget: "boolean", default: true },
              { label: "Small line above the title", name: "kicker", widget: "string", required: false },
              { label: "Title", name: "title", widget: "string" }
            ] }
          - { label: "Call to action band", name: "ctaBand", widget: "object", collapsed: true, fields: [
              { label: "Show this section", name: "enabled", widget: "boolean", default: true },
              { label: "Small line above the title", name: "kicker", widget: "string", required: false },
              { label: "Title", name: "title", widget: "string" },
              { label: "Text", name: "body", widget: "text", required: false },
              { label: "Call button text", name: "callLabel", widget: "string" },
              { label: "Booking button text", name: "bookLabel", widget: "string" }
            ] }
          - { label: "Reservations", name: "reservation", widget: "object", collapsed: true, fields: [
              { label: "Show this section", name: "enabled", widget: "boolean", default: true },
              { label: "Small line above the title", name: "kicker", widget: "string", required: false },
              { label: "Title", name: "title", widget: "string" },
              { label: "Headline", name: "headline", widget: "string" },
              { label: "Text", name: "body", widget: "list", field: { label: "Paragraph", name: "p", widget: "text" } },
              { label: "Occasion choices", name: "types", widget: "list" },
              { label: "WhatsApp opening message", name: "whatsappMessage", widget: "text", required: false }
            ] }
          - { label: "Contact section", name: "connect", widget: "object", collapsed: true, fields: [
              { label: "Show this section", name: "enabled", widget: "boolean", default: true },
              { label: "Small line above the title", name: "kicker", widget: "string", required: false },
              { label: "Title", name: "title", widget: "string" },
              { label: "Second heading line (gold)", name: "titleAccent", widget: "string", required: false },
              { label: "Lead paragraph", name: "lead", widget: "text", required: false },
              { label: "Line under the buttons", name: "tagline", widget: "string", required: false },
              { label: "Photograph", name: "image", widget: "image", required: false },
              { label: "Photograph description", name: "imageAlt", widget: "string", required: false },
              { label: "Ways to eat", name: "ways", widget: "list", required: false, summary: "{{fields.text}}", fields: [
                  { label: "Icon", name: "icon", widget: "select", options: ["scooter", "cloche", "home", "people", "call"], default: "scooter" },
                  { label: "Text", name: "text", widget: "string" }
                ] },
              { label: "Delivery note (right side)", name: "deliveryNote", widget: "text", required: false },
              { label: "Call card title", name: "callTitle", widget: "string" },
              { label: "Email card title", name: "emailTitle", widget: "string" },
              { label: "WhatsApp card title", name: "whatsappTitle", widget: "string" },
              { label: "Visit card title", name: "visitTitle", widget: "string" },
              { label: "Delivery card", name: "delivery", widget: "object", collapsed: true, fields: [
                  { label: "Show this card", name: "enabled", widget: "boolean", default: true },
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Text", name: "text", widget: "text" },
                  { label: "Button text", name: "ctaLabel", widget: "string", required: false }
                ] },
              { label: "Label above the form", name: "formBadge", widget: "string", required: false },
              { label: "Message form title", name: "formTitle", widget: "string" }
            ] }
          - label: "Extra sections"
            name: "sections"
            widget: "list"
            required: false
            label_singular: "section"
            summary: "{{fields.title}} ({{fields.type}})"
            hint: "Add one of the approved section designs. They cannot contain code."
            fields:
              - { label: "Design", name: "type", widget: "select", options: [
                    { label: "Text only", value: "text" },
                    { label: "Photograph and text", value: "image_text" },
                    { label: "Call to action", value: "cta" },
                    { label: "Questions and answers", value: "faq" },
                    { label: "Offer", value: "offer" }
                  ] }
              - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - { label: "Where it goes", name: "placement", widget: "select", default: "before_footer", options: [
                    { label: "After About KKR", value: "after_about" },
                    { label: "After signature dishes", value: "after_menu" },
                    { label: "After the gallery", value: "after_gallery" },
                    { label: "Just above the footer", value: "before_footer" }
                  ] }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "list", required: false, field: { label: "Paragraph", name: "p", widget: "text" } }
              - { label: "Small label (Offer only)", name: "label", widget: "string", required: false }
