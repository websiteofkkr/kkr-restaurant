              - { label: "Button link", name: "ctaUrl", widget: "string", required: false, hint: "A page on this site, e.g. #reserve" }
              - { label: "Questions", name: "items", widget: "list", required: false, fields: [
                    { label: "Question", name: "question", widget: "string" },
                    { label: "Answer", name: "answer", widget: "list", field: { label: "Paragraph", name: "p", widget: "text" } }
                  ] }
              - { label: "Anchor name", name: "id", widget: "string", required: false, pattern: ["^[a-z0-9-]*$", "Lowercase letters, numbers and hyphens only"] }

      - name: "menu"
        label: "Menu"
        file: "content/ps/menu.json"
        description: "Categories, dishes and prices. Tick Signature dish to show a dish on the homepage."
        fields:
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text", required: false }
          - { label: "Search title", name: "seoTitle", widget: "string", required: false }
          - { label: "Search description", name: "seoDescription", widget: "text", required: false }
          - { label: "Section list label", name: "jumpLabel", widget: "string", required: false }
          - { label: "Printed menu", name: "manual", widget: "object", collapsed: true, fields: [
              { label: "Show the printed menu", name: "enabled", widget: "boolean", default: true },
              { label: "Title", name: "title", widget: "string" },
              { label: "Text", name: "body", widget: "text", required: false },
              { label: "PDF menu", name: "file", widget: "file", required: false },
              { label: "Menu photographs", name: "images", widget: "list", required: false, field: { label: "Page", name: "img", widget: "image" } },
              { label: "Photograph description", name: "imageAlt", widget: "string", required: false }
            ] }
          - label: "Categories"
            name: "categories"
            widget: "list"
            label_singular: "category"
            summary: "{{fields.name}}"
            fields:
              - { label: "Category name", name: "name", widget: "string" }
              - { label: "Short code", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and hyphens only"], hint: "Used in the web address. Keep it the same in all three languages." }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Order", name: "order", widget: "number", value_type: "int", default: 1 }
              - label: "Dishes"
                name: "items"
                widget: "list"
                label_singular: "dish"
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { label: "Dish name", name: "name", widget: "string" }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - { label: "Price", name: "price", widget: "string" }
                  - { label: "Price before the offer", name: "priceBefore", widget: "string", required: false, hint: "Shown struck through beside the new price. Leave empty when there is no offer." }
                  - { label: "Offer tag", name: "offer", widget: "string", required: false, hint: "A short badge on the card, for example: 15% off, or Weekend special." }
                  - { label: "Sticker", name: "badge", widget: "string", required: false, hint: "A gold sticker on the item, for example: Best seller, Chef's pick, or New." }
                  - { label: "Serves", name: "serves", widget: "string", required: false, hint: "For example: 5-6 persons. Shown on the platter cards." }
                  - { label: "Available today", name: "available", widget: "boolean", default: true }
                  - { label: "Signature dish", name: "featured", widget: "boolean", default: false }
                  - { label: "Best food", name: "bestFood", widget: "boolean", default: false, hint: "Adds a gold 'Best Food' badge next to this dish everywhere it appears on the site." }
                  - { label: "Photograph", name: "image", widget: "image", required: false }
                  - { label: "Photograph description", name: "imageAlt", widget: "string", required: false }

      - name: "gallery"
        label: "Gallery"
        file: "content/ps/gallery.json"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Short code", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and hyphens only"] }
          - label: "Photographs"
            name: "images"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photograph", name: "src", widget: "image" }
              - { label: "Description for screen readers", name: "alt", widget: "string", hint: "Describe what is in the photograph." }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Category", name: "category", widget: "string", required: false }
              - { label: "Order", name: "order", widget: "number", value_type: "int", default: 1 }
              - { label: "Show this photograph", name: "enabled", widget: "boolean", default: true }

      - name: "reviews"
        label: "Customer reviews"
        file: "content/ps/reviews.json"
        description: "Only add reviews real guests have given you. Leave the list empty and the section disappears from the site."
        fields:
          - label: "Reviews"
            name: "items"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: "Customer name", name: "name", widget: "string" }
              - { label: "Rating out of 5", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, required: false }
              - { label: "Review", name: "text", widget: "text" }
